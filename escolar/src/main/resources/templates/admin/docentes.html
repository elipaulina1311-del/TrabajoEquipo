<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Docentes — UAEM Atlacomulco</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/admin/dashboard}">
            <i class="bi bi-mortarboard-fill me-2"></i>UAEM Atlacomulco
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuAdminDocente">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuAdminDocente">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/alumnos}">Alumnos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active fw-semibold" th:href="@{/admin/docentes}">Docentes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/docente/reportes}">Reportes PDF</a>
                </li>
            </ul>
            <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">
                <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión
            </a>
        </div>
    </div>
</nav>

<div class="container-fluid py-4 px-3 px-md-4">

    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <!-- Formulario Alta / Edición -->
        <div class="col-12 col-lg-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <span class="fw-semibold"
                          th:text="${docenteForm.idAsignacion > 0 ? 'Actualizar Asignación (#' + docenteForm.idAsignacion + ')' : 'Registrar Docente / Asignación'}">
                        Registrar Docente
                    </span>
                    <a th:if="${docenteForm.idAsignacion > 0}" th:href="@{/admin/docentes}" class="btn btn-sm btn-outline-light">
                        Cancelar
                    </a>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/docentes/guardar}" th:object="${docenteForm}" method="post">
                        <input type="hidden" th:field="*{idAsignacion}">

                        <div class="row g-2 mb-2">
                            <div class="col-5">
                                <label class="form-label small fw-semibold">ID Docente</label>
                                <input type="number" class="form-control form-control-sm" th:field="*{id}" min="1" required>
                            </div>
                            <div class="col-7">
                                <label class="form-label small fw-semibold">No. de Empleado</label>
                                <input type="text" class="form-control form-control-sm" th:field="*{numeroEmpleado}" placeholder="EMP1001" required>
                            </div>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small fw-semibold">Nombre(s)</label>
                            <input type="text" class="form-control form-control-sm" th:field="*{nombre}" required>
                        </div>

                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Apellido Paterno</label>
                                <input type="text" class="form-control form-control-sm" th:field="*{apPaterno}" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Apellido Materno</label>
                                <input type="text" class="form-control form-control-sm" th:field="*{apMaterno}" required>
                            </div>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small fw-semibold">Materia</label>
                            <input type="text" class="form-control form-control-sm" th:field="*{materia}" placeholder="Programación II" required>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-8">
                                <label class="form-label small fw-semibold">Carrera</label>
                                <input type="text" class="form-control form-control-sm" th:field="*{carrera}" placeholder="Ingeniería en Computación" required>
                            </div>
                            <div class="col-4">
                                <label class="form-label small fw-semibold">Grupo</label>
                                <input type="text" class="form-control form-control-sm" th:field="*{grupo}" placeholder="ICO-30" required>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-sm fw-semibold">
                                <i class="bi bi-save-fill me-1"></i>
                                <span th:text="${docenteForm.idAsignacion > 0 ? 'Actualizar Asignación' : 'Guardar Docente'}">Guardar</span>
                            </button>
                            <button type="reset" class="btn btn-outline-secondary btn-sm">Limpiar Campos</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Filtros y Tabla -->
        <div class="col-12 col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <form th:action="@{/admin/docentes}" method="get" class="row g-2 align-items-center">
                        <div class="col-12 col-md-5">
                            <input type="text" name="q" class="form-control form-control-sm"
                                   th:value="${q}" placeholder="Buscar por ID, docente, materia o grupo...">
                        </div>
                        <div class="col-8 col-md-4">
                            <select name="carrera" class="form-select form-select-sm">
                                <option value="TODAS" th:selected="${carreraSeleccionada == 'TODAS'}">Todas las carreras</option>
                                <option th:each="c : ${carreras}" th:value="${c}" th:text="${c}"
                                        th:selected="${carreraSeleccionada == c}"></option>
                            </select>
                        </div>
                        <div class="col-4 col-md-3 d-grid">
                            <button type="submit" class="btn btn-primary btn-sm">
                                <i class="bi bi-search me-1"></i>Filtrar
                            </button>
                        </div>
                    </form>
                </div>

                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover table-striped align-middle mb-0 small">
                            <thead class="table-dark">
                            <tr>
                                <th>ID Doc.</th>
                                <th>Docente</th>
                                <th>No. Emp.</th>
                                <th>Materia</th>
                                <th>Carrera</th>
                                <th>Grupo</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${#lists.isEmpty(docentes)}">
                                <td colspan="7" class="text-center text-muted py-4">
                                    No se encontraron registros de docentes.
                                </td>
                            </tr>
                            <tr th:each="doc : ${docentes}">
                                <td class="fw-bold" th:text="${doc.id}">1</td>
                                <td th:text="${doc.nombreCompleto}">Iván Gallegos Miranda</td>
                                <td th:text="${doc.numeroEmpleado}">EMP1001</td>
                                <td th:text="${doc.materia}">Programación II</td>
                                <td th:text="${doc.carrera}">Ingeniería en Computación</td>
                                <td><span class="badge bg-secondary" th:text="${doc.grupo}">ICO-30</span></td>
                                <td class="text-center text-nowrap">
                                    <a th:href="@{/admin/docentes(editarId=${doc.idAsignacion})}"
                                       class="btn btn-outline-primary btn-sm" title="Editar">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    <a th:href="@{/docente/pdf/individual(idDocente=${doc.id})}"
                                       class="btn btn-outline-success btn-sm" title="Descargar PDF del docente">
                                        <i class="bi bi-file-earmark-pdf-fill"></i>
                                    </a>
                                    <form th:action="@{/admin/docentes/eliminar/{id}(id=${doc.idAsignacion})}"
                                          method="post" class="d-inline"
                                          onsubmit="return confirm('¿Seguro que deseas eliminar esta asignación docente?');">
                                        <button type="submit" class="btn btn-outline-danger btn-sm" title="Eliminar">
                                            <i class="bi bi-trash-fill"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
