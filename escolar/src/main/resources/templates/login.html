<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Control Escolar UAEM Atlacomulco</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-6 col-lg-4">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="bg-success text-white text-center py-4 px-3">
                    <i class="bi bi-mortarboard-fill display-5"></i>
                    <h4 class="fw-bold mt-2 mb-0">Control Escolar</h4>
                    <small class="opacity-75">Centro Universitario UAEM Atlacomulco</small>
                </div>

                <div class="card-body p-4">
                    <div th:if="${mensajeError}" class="alert alert-danger small py-2" role="alert">
                        <i class="bi bi-shield-exclamation me-1"></i>
                        <span th:text="${mensajeError}"></span>
                    </div>

                    <div th:if="${mensajeExito}" class="alert alert-success small py-2" role="alert">
                        <i class="bi bi-check-circle-fill me-1"></i>
                        <span th:text="${mensajeExito}"></span>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-secondary">Tipo de Usuario</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-person-fill text-success"></i></span>
                                <select name="usuario" class="form-select" required>
                                    <option value="alumno">Alumno</option>
                                    <option value="docente">Docente</option>
                                    <option value="administrador">Administrador</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-semibold text-secondary">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-lock-fill text-success"></i></span>
                                <input type="password" name="password" class="form-control"
                                       placeholder="Ej. ALU2, DOC1 o Admin1234" required>
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success fw-semibold py-2">
                                <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar al Sistema
                            </button>
                        </div>
                    </form>
                </div>

                <div class="card-footer bg-white text-center py-3 border-top">
                    <small class="text-muted">Autenticación protegida con cifrado <strong>SHA-256</strong></small>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
